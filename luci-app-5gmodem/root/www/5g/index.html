<!DOCTYPE html>
<!--
  ПРОТОТИП лёгкой страницы: те же метрики, но без фреймворка LuCI.
  Всё в одном файле - ни одного дополнительного запроса за скриптами и стилями,
  кроме самих данных. Ради чистоты замера: сравниваем открытие ЭТОЙ страницы с
  открытием вкладки «Сеть» в LuCI на том же роутере.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5G modem</title>
<style>
:root { color-scheme: light dark; }
body {
  font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  margin: 0; padding: 1rem; max-width: 46rem;
}
h1 { font-size: 1.1rem; margin: 0 0 .8rem; }
.row { display: flex; gap: .6rem; padding: .15rem 0; }
.k { flex: 0 0 9rem; opacity: .6; }
.v { flex: 1 1 auto; overflow-wrap: anywhere; }
.bar { height: .5rem; border-radius: 3px; background: #8883; overflow: hidden; margin-top: .35rem; }
.bar > i { display: block; height: 100%; background: currentColor; }
.grp { border: 1px solid #8884; border-radius: 6px; padding: .6rem .8rem; margin-bottom: .7rem; }
.grp > b { display: block; font-size: .85rem; opacity: .7; margin-bottom: .3rem; }
input, button { font: inherit; padding: .25rem .4rem; }
#err { color: #c33; }
#t { opacity: .55; font-size: .8rem; }
</style>
</head>
<body>
<h1>5G modem <span id="t"></span></h1>
<div id="err"></div>
<div id="out"></div>

<script>
/* Замер держим честным: время считаем от начала запроса до отрисовки. */
var started = performance.now();

var FIELDS = [
  ['Модем',    ['modem', 'operator_name', 'phone']],
  ['Сигнал',   ['signal', 'rsrp', 'rsrq', 'sinr', 'rssi']],
  ['Сота',     ['mode', 'pband', 'pci', 'earfcn', 'lac_hex', 'cid_hex']],
  ['Связь',    ['ipaddr', 'conn_time', 'rx', 'tx', 'mtemp']]
];
var NAMES = {
  modem: 'Модель', operator_name: 'Оператор', phone: 'Телефон',
  signal: 'Уровень', rsrp: 'RSRP', rsrq: 'RSRQ', sinr: 'SINR', rssi: 'RSSI',
  mode: 'Режим', pband: 'Диапазон', pci: 'PCI', earfcn: 'EARFCN',
  lac_hex: 'LAC', cid_hex: 'Cell ID',
  ipaddr: 'IP', conn_time: 'Время', rx: 'Принято', tx: 'Отдано', mtemp: 'Темп.'
};

function render(j) {
  var html = '';
  FIELDS.forEach(function(g) {
    html += '<div class="grp"><b>' + g[0] + '</b>';
    g[1].forEach(function(k) {
      var v = j[k];
      if (v === undefined || v === '' || v === '-') return;
      html += '<div class="row"><span class="k">' + (NAMES[k] || k) + '</span>'
           +  '<span class="v">' + String(v).replace(/&deg;/g, '°') + '</span></div>';
      if (k === 'signal') {
        html += '<div class="bar"><i style="width:' + (parseInt(v, 10) || 0) + '%"></i></div>';
      }
    });
    html += '</div>';
  });
  document.getElementById('out').innerHTML = html;
}

/* Вход. Сессию LuCI переиспользовать нельзя: её кука выдана с
   path=/cgi-bin/luci и флагом HttpOnly - браузер не пришлёт её сюда, а JS не
   прочитает (подробности в 5g-api). Поэтому свой вход, но по учётным данным
   САМОГО РОУТЕРА: их проверяет ubus, мы ничего не храним. */
function showLogin() {
  document.getElementById('out').innerHTML =
    '<div class="grp"><b>Вход</b>' +
    '<div class="row"><span class="k">Пользователь</span>' +
    '<span class="v"><input id="lu" value="root" autocomplete="username"></span></div>' +
    '<div class="row"><span class="k">Пароль</span>' +
    '<span class="v"><input id="lp" type="password" autocomplete="current-password"></span></div>' +
    '<div class="row"><span class="k"></span><span class="v">' +
    '<button id="lb">Войти</button></span></div></div>';
  document.getElementById('lp').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { doLogin(); }
  });
  document.getElementById('lb').addEventListener('click', doLogin);
  document.getElementById('lp').focus();
}

function doLogin() {
  var u = document.getElementById('lu').value;
  var p = document.getElementById('lp').value;
  document.getElementById('err').textContent = '';
  fetch('/cgi-bin/5g-api?login', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'user=' + encodeURIComponent(u) + '&pass=' + encodeURIComponent(p)
  }).then(function(r) {
    if (!r.ok) { throw new Error('Неверный логин или пароль'); }
    started = performance.now();
    load();
  }).catch(function(e) { document.getElementById('err').textContent = e.message; });
}

function load() {
  var t0 = performance.now();
  fetch('/cgi-bin/5g-api?metrics', { credentials: 'same-origin' })
    .then(function(r) {
      if (r.status === 401 || r.status === 403) { showLogin(); return null; }
      return r.json();
    })
    .then(function(j) {
      if (!j) { return; }   /* показана форма входа */
      render(j);
      var now = performance.now();
      document.getElementById('t').textContent =
        'запрос ' + Math.round(now - t0) + ' мс, страница ' + Math.round(now - started) + ' мс';
    })
    .catch(function(e) { document.getElementById('err').textContent = e.message; });
}

load();
setInterval(load, 5000);
</script>
</body>
</html>
