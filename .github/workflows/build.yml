name: Build packages

# The package is PKGARCH:=all (arch-independent), so ONE build per package
# format is enough for every device:
#   - a 23.05 SDK produces the .ipk
#   - a snapshot SDK produces the .apk
# On a version tag (v*) the artifacts are attached to a GitHub Release;
# the workflow can also be run manually from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # <target_arch>-<openwrt_version>. x86_64 is only the *builder*;
        # the resulting package is arch-independent and installs anywhere.
        arch:
          - x86_64-23.05.5   # -> .ipk
          - x86_64-SNAPSHOT  # -> .apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: fdmodem
          PACKAGES: luci-app-5gmodem
          NO_REFRESH_CHECK: 1
          # keep memory in check while heavy deps (glib2 via modemmanager)
          # compile on the runner
          MAKEFLAGS: -j2
          V: s

      - name: Collect packages
        run: |
          mkdir -p out
          find bin/ -type f \( -name 'luci-app-5gmodem*.ipk' -o -name 'luci-app-5gmodem*.apk' \) -exec cp -v {} out/ \;
          echo "--- collected ---"; ls -l out/

      - name: Upload build logs on failure
        if: failure()
        run: |
          mkdir -p logs
          # buildroot logs (if the action kept them) + our package build dir
          find . -type d -name logs -exec cp -r {} logs/ \; 2>/dev/null || true
          find bin/ -maxdepth 6 -name '*.log' -exec cp {} logs/ \; 2>/dev/null || true
          tar -czf build-logs.tar.gz logs 2>/dev/null || true
      - name: Upload logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.arch }}
          path: build-logs.tar.gz
          if-no-files-found: ignore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-5gmodem-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: false
