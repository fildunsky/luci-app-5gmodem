name: Build packages

# The package is PKGARCH:=all (arch-independent), so ONE build per package
# format is enough for every device:
#   - a 23.05 SDK produces the .ipk
#   - a snapshot SDK produces the .apk
# On a version tag (v*) the artifacts are attached to a GitHub Release;
# the workflow can also be run manually from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # <target_arch>-<openwrt_version>. x86_64 is only the *builder*;
        # the resulting package is arch-independent and installs anywhere.
        arch:
          - x86_64-24.10.7   # -> .ipk (24.10 still defaults to opkg/ipk; its
                             #    libxslt host tool builds fine, unlike 23.05.5)
          - x86_64-SNAPSHOT  # -> .apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: modem
          # ТОЛЬКО исходный пакет. Облегчённый вариант (luci-app-5gmodem-lite)
          # объявлен в том же Makefile и собирается вместе с основным сам -
          # отдельно его сюда писать НЕЛЬЗЯ: SDK принимает здесь имена каталогов
          # исходников и на "…-lite" отвечает
          #   No rule to make target 'package/luci-app-5gmodem-lite/download'.
          # Готовые файлы обоих вариантов забирает шаг Collect по маске *5gmodem*.
          PACKAGES: luci-app-5gmodem
          NO_REFRESH_CHECK: 1
          # write per-package build logs to logs/ so a failure is diagnosable,
          # and keep memory in check while heavy deps compile on the runner
          BUILD_LOG: 1
          MAKEFLAGS: -j2
          V: s

      # If the build failed, surface the ACTUAL error (the toplevel "Error 2"
      # is useless; the real one is the first failing package's compile log).
      - name: Show failing build log
        if: failure()
        run: |
          echo "::group::failing package logs"
          found=0
          for f in $(find logs -name '*.txt' 2>/dev/null); do
            if grep -qiE 'Error [0-9]|: error:|ERROR:|collect2|No such file' "$f"; then
              echo "----------------- $f -----------------"
              tail -n 80 "$f"
              found=1
            fi
          done
          [ "$found" = 1 ] || echo "no package log with an obvious error was found under logs/"
          echo "::endgroup::"
          tar -czf build-logs.tar.gz logs 2>/dev/null || true
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.arch }}
          path: build-logs.tar.gz
          if-no-files-found: ignore

      - name: Collect packages
        run: |
          mkdir -p out
          # grab the app AND its translation subpackages (luci-i18n-5gmodem-*)
          find bin/ -type f \( -name '*5gmodem*.ipk' -o -name '*5gmodem*.apk' \) -exec cp -v {} out/ \;
          echo "--- collected ---"; ls -l out/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-5gmodem-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: false
