name: Build packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: x86_64-25.12.5
            ver: 25.12.5
            label: 25.12.x (apk)
            slug: 25.12-apk
          - sdk: x86_64-24.10.8
            ver: 24.10.8
            label: 24.10.x (opkg)
            slug: 24.10-opkg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find SDK
        id: sdk
        run: CHECK_ONLY=1 .github/scripts/fetch-sdk.sh ${{ matrix.ver }} x86/64 sdk

      - name: Cache SDK
        uses: actions/cache@v4
        with:
          path: sdk/sdk.tar
          key: sdk-${{ steps.sdk.outputs.sdk_sum }}

      - name: Download SDK
        run: .github/scripts/fetch-sdk.sh ${{ matrix.ver }} x86/64 sdk

      - name: Build the MediaTek pocket-router AT client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-linux-gnueabihf
          ./5gmodem-mtk-at/build-usock.sh

      - name: Check embedded icons
        run: python3 luci-app-5gmodem/tools/gen-icons.py --check

      - name: Build with OpenWrt SDK
        run: |
          mkdir -p built && chmod 777 built
          docker run --rm -v "$PWD":/feed -v "$PWD/sdk":/sdk:ro -v "$PWD/built":/artifacts openwrt/sdk:${{ matrix.sdk }} bash /feed/.github/scripts/fast-build.sh

      - name: Show failing build log
        if: failure()
        run: |
          echo "::group::failing package logs"
          found=0
          for f in $(find logs -name '*.txt' 2>/dev/null); do
            if grep -qiE 'Error [0-9]|: error:|ERROR:|collect2|No such file' "$f"; then
              echo "----------------- $f -----------------"
              tail -n 80 "$f"
              found=1
            fi
          done
          [ "$found" = 1 ] || echo "no package log with an obvious error was found under logs/"
          echo "::endgroup::"
          tar -czf build-logs.tar.gz logs 2>/dev/null || true
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.slug }}
          path: build-logs.tar.gz
          if-no-files-found: ignore

      - name: Collect packages
        run: |
          mkdir -p out
          find built/ -type f \( -name '*5gmodem*.ipk' -o -name '*5gmodem*.apk' \) -exec cp -v {} out/ \;
          for f in out/5gmodem-mtk-at[-_]*; do
            [ -e "$f" ] || continue
            case "$f" in
              *.apk) mv -v "$f" out/5gmodem-mtk-at.apk ;;
              *.ipk) mv -v "$f" out/5gmodem-mtk-at.ipk ;;
            esac
          done
          for f in out/luci-i18n-5gmodem-*; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            lang=$(echo "$base" | sed -n 's/^luci-i18n-5gmodem-\([a-z-]*\)[-_][0-9].*/\1/p')
            [ -n "$lang" ] || continue
            case "$base" in
              *.apk) mv -v "$f" "out/luci-i18n-5gmodem-$lang.apk" ;;
              *.ipk) mv -v "$f" "out/luci-i18n-5gmodem-$lang.ipk" ;;
            esac
          done
          echo "--- collected ---"; ls -l out/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-5gmodem-${{ matrix.slug }}
          path: out/*
          if-no-files-found: error

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "" \
              || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" out/* --clobber

  publish:
    name: Publish release, point README links
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Check attached packages
        run: |
          set -e
          V="${TAG#v}"
          R=$(git show "$TAG:luci-app-5gmodem/Makefile" | sed -n 's/^PKG_RELEASE:=//p')
          [ -n "$R" ] || { echo "::error::PKG_RELEASE not found in $TAG"; exit 1; }
          NAMES=$(gh release view "$TAG" --json assets -q '.assets[].name')
          MISSING=0
          for WANT in "luci-app-5gmodem-$V-r$R.apk" "luci-app-5gmodem-lite-$V-r$R.apk" \
                      "luci-app-5gmodem_$V-r${R}_all.ipk" "luci-app-5gmodem-lite_$V-r${R}_all.ipk" \
                      "luci-i18n-5gmodem-zh-cn.apk" "luci-i18n-5gmodem-zh-cn.ipk" \
                      "luci-i18n-5gmodem-vi.apk" "luci-i18n-5gmodem-vi.ipk" \
                      "luci-i18n-5gmodem-id.apk" "luci-i18n-5gmodem-id.ipk" \
                      "5gmodem-mtk-at.apk" "5gmodem-mtk-at.ipk"; do
            if printf '%s\n' "$NAMES" | grep -qxF "$WANT"; then
              echo "ok      $WANT"
            else
              echo "::error::missing asset $WANT"; MISSING=1
            fi
          done
          [ "$MISSING" = 0 ]
          echo "PKG_V=$V" >> "$GITHUB_ENV"
          echo "PKG_R=$R" >> "$GITHUB_ENV"

      - name: Publish release
        run: gh release edit "$TAG" --draft=false --latest

      - name: Point README install links at the release
        run: |
          set -e
          .github/scripts/readme-links.sh "$PKG_V" "$PKG_R"
          FAIL=0
          for U in $(grep -hoE 'https://github.com/fildunsky/luci-app-5gmodem/releases/download/[^ )<>"]+' README*.md | sort -u); do
            CODE=$(curl -sIL -o /dev/null -w '%{http_code}' "$U")
            echo "$CODE $U"
            [ "$CODE" = 200 ] || FAIL=1
          done
          [ "$FAIL" = 0 ] || { echo "::error::a README link does not resolve - not committing"; exit 1; }
          if git diff --quiet -- README.md README.ru.md README.zh-CN.md README.ja.md README.vi.md README.id.md; then
            echo "README links already point at $TAG"
            exit 0
          fi
          git config user.name "Fil Dunsky"
          git config user.email "filipp.dunsky@gmail.com"
          git commit -m "README: install links for $TAG" -- README.md README.ru.md README.zh-CN.md README.ja.md README.vi.md README.id.md
          for TRY in 1 2 3; do
            git push origin HEAD:master && exit 0
            git pull --rebase origin master
          done
          echo "::error::could not push the README update"; exit 1
