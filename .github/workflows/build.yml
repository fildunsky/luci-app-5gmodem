name: Build packages

# The package is PKGARCH:=all (arch-independent), so ONE build per package
# format is enough for every device:
#   - a 24.10 SDK produces the .ipk (that branch still defaults to opkg)
#   - a 25.12 SDK produces the .apk (the format current releases use)
# On a version tag (v*) the artifacts are attached to a DRAFT GitHub Release,
# and only the publish job - after BOTH builds succeeded and every package is
# attached - makes the release public and points the README install links at
# it. Until that moment "latest" (README links, the in-app updater, the
# releases/latest API) keeps serving the previous, complete release, so there
# is no window in which the install command or the update button hits a 404.
# A failed build leaves the draft unpublished and everything on the old version.
# The workflow can also be run manually from the Actions tab (no release then).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ЧТО ЗДЕСЬ ДВА РАЗНЫХ ПОЛЯ. sdk - это ТЕГ ОБРАЗА openwrt/sdk, его
        # нельзя писать произвольно: значение уходит в переменную ARCH, и
        # действие тянет по нему контейнер (нет такого тега - сборка падает
        # сразу). label - только подпись задания в списке Actions, чтобы с
        # первого взгляда было видно ветку и формат пакета. slug - то же для
        # имён артефактов: там пробелы и скобки нежелательны.
        #
        # x86_64 - это только СБОРЩИК: пакет arch-independent и ставится на
        # любое железо.
        include:
          - sdk: x86_64-25.12.5
            label: 25.12.x (apk)
            slug: 25.12-apk
          - sdk: x86_64-24.10.8
            label: 24.10.x (opkg)
            slug: 24.10-opkg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.sdk }}
          FEEDNAME: modem
          # ТОЛЬКО исходный пакет. Облегчённый вариант (luci-app-5gmodem-lite)
          # объявлен в том же Makefile и собирается вместе с основным сам -
          # отдельно его сюда писать НЕЛЬЗЯ: SDK принимает здесь имена каталогов
          # исходников и на "…-lite" отвечает
          #   No rule to make target 'package/luci-app-5gmodem-lite/download'.
          # Готовые файлы обоих вариантов забирает шаг Collect по маске *5gmodem*.
          PACKAGES: luci-app-5gmodem
          NO_REFRESH_CHECK: 1
          # ЛОГИ ПО ПАКЕТАМ - чтобы падение было разбираемо (logs/).
          BUILD_LOG: 1
          # ПАРАЛЛЕЛЬНОСТЬ ПО ЧИСЛУ ЯДЕР РАННЕРА, а не жёсткое «-j2».
          #
          # Прежнее ограничение ставилось «чтобы не съесть память»: наш пакет -
          # набор скриптов, но SDK тянет сборку зависимостей, а среди них
          # тяжёлый стек ModemManager (glib2, gio, libmm-glib). На них уходит
          # почти всё время сборки (24 минуты у apk-задания). У стандартного
          # раннера GitHub четыре ядра и 16 ГБ: половина простаивала, а памяти
          # этим пакетам нужно заметно меньше доступного.
          MAKEFLAGS: -j4
          # V=s печатает каждую команду компилятора: мегабайты бесполезного
          # лога и время на его запись. При падении подробности всё равно
          # берутся из logs/ шагом «Show failing build log» ниже.
          V: w

      # If the build failed, surface the ACTUAL error (the toplevel "Error 2"
      # is useless; the real one is the first failing package's compile log).
      - name: Show failing build log
        if: failure()
        run: |
          echo "::group::failing package logs"
          found=0
          for f in $(find logs -name '*.txt' 2>/dev/null); do
            if grep -qiE 'Error [0-9]|: error:|ERROR:|collect2|No such file' "$f"; then
              echo "----------------- $f -----------------"
              tail -n 80 "$f"
              found=1
            fi
          done
          [ "$found" = 1 ] || echo "no package log with an obvious error was found under logs/"
          echo "::endgroup::"
          tar -czf build-logs.tar.gz logs 2>/dev/null || true
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.slug }}
          path: build-logs.tar.gz
          if-no-files-found: ignore

      - name: Collect packages
        run: |
          mkdir -p out
          # grab the app AND its translation subpackages (luci-i18n-5gmodem-*)
          find bin/ -type f \( -name '*5gmodem*.ipk' -o -name '*5gmodem*.apk' \) -exec cp -v {} out/ \;
          # У языковых пакетов версия из luci.mk - хеш коммита в имени файла,
          # оно меняется каждый релиз и на него нельзя дать постоянную ссылку в
          # README. ПЕРЕИМЕНОВЫВАЕМ в стабильное имя (luci-i18n-5gmodem-
          # <lang>.apk/.ipk). Раньше клали копию РЯДОМ, и в релизе висели два
          # побайтово одинаковых файла на каждый язык - восемь активов вместо
          # четырёх, и человек не понимал, какой из них брать (замечание
          # владельца 25.08.2026). Версия пакета от переименования не теряется:
          # она внутри метаданных, менеджер её видит.
          for f in out/luci-i18n-5gmodem-*; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            lang=$(echo "$base" | sed -n 's/^luci-i18n-5gmodem-\([a-z-]*\)[-_][0-9].*/\1/p')
            [ -n "$lang" ] || continue
            case "$base" in
              *.apk) mv -v "$f" "out/luci-i18n-5gmodem-$lang.apk" ;;
              *.ipk) mv -v "$f" "out/luci-i18n-5gmodem-$lang.ipk" ;;
            esac
          done
          echo "--- collected ---"; ls -l out/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-5gmodem-${{ matrix.slug }}
          path: out/*
          if-no-files-found: error

      # Upload with the gh CLI, NOT softprops/action-gh-release: that action
      # publishes a reused draft after uploading unless told otherwise, and with
      # two matrix jobs the first one would make the release public while the
      # other format was still building. `gh release upload` never changes the
      # draft state. The draft normally exists already (created with the notes
      # before the tag is pushed); if not, create an empty one - `|| view`
      # covers the other matrix job having created it a moment earlier.
      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "" \
              || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" out/* --clobber

  publish:
    name: Publish release, point README links
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      # Every package the READMEs and the updater point at must be there, or the
      # release stays a draft - publishing half a release is exactly the bug
      # this job exists to prevent.
      - name: Check attached packages
        run: |
          set -e
          V="${TAG#v}"
          R=$(git show "$TAG:luci-app-5gmodem/Makefile" | sed -n 's/^PKG_RELEASE:=//p')
          [ -n "$R" ] || { echo "::error::PKG_RELEASE not found in $TAG"; exit 1; }
          NAMES=$(gh release view "$TAG" --json assets -q '.assets[].name')
          MISSING=0
          for WANT in "luci-app-5gmodem-$V-r$R.apk" "luci-app-5gmodem-lite-$V-r$R.apk" \
                      "luci-app-5gmodem_$V-r${R}_all.ipk" "luci-app-5gmodem-lite_$V-r${R}_all.ipk" \
                      "luci-i18n-5gmodem-zh-cn.apk" "luci-i18n-5gmodem-zh-cn.ipk"; do
            if printf '%s\n' "$NAMES" | grep -qxF "$WANT"; then
              echo "ok      $WANT"
            else
              echo "::error::missing asset $WANT"; MISSING=1
            fi
          done
          [ "$MISSING" = 0 ]
          echo "PKG_V=$V" >> "$GITHUB_ENV"
          echo "PKG_R=$R" >> "$GITHUB_ENV"

      - name: Publish release
        run: gh release edit "$TAG" --draft=false --latest

      - name: Point README install links at the release
        run: |
          set -e
          .github/scripts/readme-links.sh "$PKG_V" "$PKG_R"
          FAIL=0
          for U in $(grep -hoE 'https://github.com/fildunsky/luci-app-5gmodem/releases/download/[^ )<>"]+' README*.md | sort -u); do
            CODE=$(curl -sIL -o /dev/null -w '%{http_code}' "$U")
            echo "$CODE $U"
            [ "$CODE" = 200 ] || FAIL=1
          done
          [ "$FAIL" = 0 ] || { echo "::error::a README link does not resolve - not committing"; exit 1; }
          if git diff --quiet -- README.md README.ru.md README.zh-CN.md; then
            echo "README links already point at $TAG"
            exit 0
          fi
          git config user.name "Fil Dunsky"
          git config user.email "filipp.dunsky@gmail.com"
          git commit -m "README: install links for $TAG" -- README.md README.ru.md README.zh-CN.md
          for TRY in 1 2 3; do
            git push origin HEAD:master && exit 0
            git pull --rebase origin master
          done
          echo "::error::could not push the README update"; exit 1
